name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Build NasmMakeC
        run: |
          gcc -Wall -Wextra -std=c11 \
            main.c \
            arg_interpretation.c \
            print.c \
            read_from_bin.c \
            run_config.c \
            validate.c \
            -o nmc

      - name: Verify executable
        run: ./nmc help
